name: "[VV//LIVEWIRE] Feature / skin request"
description: Suggest a feature or a new look for VV//LIVEWIRE.
title: "[VV//LIVEWIRE] Request: "
labels: ["enhancement", "vv-livewire"]
body:
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What would you like VV//LIVEWIRE to do or look like?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it would help
    validations:
      required: false
  - type: textarea
    id: refs
    attributes:
      label: References (optional)
      description: Links or images for inspiration. Please remove personal info.
    validations:
      required: false
